name: RTL to GDSII

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MA_DE: C04
  DESIGN_NAME: c04_core
  CONFIG: config.json

jobs:
  mo-phong:
    name: 1 - Mo phong RTL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cai Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Bien dich va chay testbench
        run: |
          iverilog -g2012 -o sim.vvp rtl/*.sv tb/*.sv
          vvp sim.vvp | tee simulation.log

      - name: Kiem tra ket qua
        run: |
          if grep -qiE "FATAL|mismatch|FAIL" simulation.log; then
            echo "::error::Testbench bao loi"
            exit 1
          fi

          if ! grep -qi "PASS" simulation.log; then
            echo "::error::Khong tim thay PASS"
            exit 1
          fi

          echo "Mo phong dat."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-phong-${{ env.MA_DE }}
          path: |
            simulation.log
            *.vcd
          if-no-files-found: warn

  rtl2gds:
    name: 2 - RTL-to-GDSII
    runs-on: ubuntu-latest
    needs: mo-phong

    steps:
      - uses: actions/checkout@v4

      - name: Cai Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Lay LibreLane
        run: git clone --depth 1 https://github.com/librelane/librelane ~/librelane

      - name: Chay flow
        run: |
          cd ~/librelane
          nix-shell --run "cd '$GITHUB_WORKSPACE' && librelane --version && librelane '$CONFIG'"

      - name: Kiem tra san pham
        run: |
          GDS=$(find . -name "*.gds" | head -1)
          MJ=$(find . -name "metrics.json" | head -1)

          if [ -z "$GDS" ]; then
            echo "::error::Khong sinh duoc GDS"
            exit 1
          fi

          if [ -z "$MJ" ]; then
            echo "::error::Khong co metrics.json"
            exit 1
          fi

          echo "GDS: $GDS"
          echo "Metrics: $MJ"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl2gds-${{ env.MA_DE }}
          path: |
            **/runs/**/final/**
            **/runs/**/*.log
            **/metrics.json
            **/*.gds
          if-no-files-found: warn
